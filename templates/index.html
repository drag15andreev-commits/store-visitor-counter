<!doctype html><html lang="ru"><meta charset="utf-8"><title>Подсчёт посетителей</title><link rel="stylesheet" href="/static/style.css"><main><nav><a href="/history">История и отчёты</a></nav><h1>Подсчёт посетителей на изображении</h1><p>Загрузите фотографию. YOLOv8 найдёт людей и сохранит результат в журнале.</p><form id="form"><label>Изображение (до 8 МиБ)<input type="file" name="image" accept="image/*" required></label><button>Обработать изображение</button></form><p id="status" role="status"></p><img id="result" hidden alt="Обнаруженные люди"></main><script>
const form=document.querySelector('#form'), statusText=document.querySelector('#status'), result=document.querySelector('#result');
form.addEventListener('submit',async event=>{event.preventDefault();form.querySelector('button').disabled=true;result.hidden=true;statusText.textContent='Выполняется обработка…';try{const response=await fetch('/process',{method:'POST',body:new FormData(form)});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ошибка сервера');statusText.textContent='Обнаружено людей: '+data.count;result.src=data.result_url;result.hidden=false;}catch(error){statusText.textContent='Ошибка: '+error.message;}finally{form.querySelector('button').disabled=false;}});
</script></html>
